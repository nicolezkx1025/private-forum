<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私享论坛 MVP</title>
    <link rel="stylesheet" href="style.css"> <!-- 如果有CSS -->
</head>
<body>
    <h1>私享论坛 - 基础分享</h1>
    <div id="posts"></div> <!-- 这里显示帖子 -->

    <h2>提交新帖子</h2>
    <form id="postForm">
        <textarea id="content" placeholder="输入文字，支持链接（如图片/视频URL）" required></textarea>
        <button type="submit">提交</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
